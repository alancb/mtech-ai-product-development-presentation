<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 0 940 500" role="img" aria-labelledby="title description">
  <title id="title">Shared responsibilities across an AI-enabled product team</title>
  <desc id="description">Product, Design, Develop, and Test each overlap shared responsibilities in Product thinking, Systems, AI development, AI agents, and Ethics.</desc>
  <defs>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.09" />
    </filter>
    <filter id="core-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6d0020" flood-opacity="0.10" />
    </filter>
    <style>
      .display { font-family: Gotham, Montserrat, "Avenir Next", Arial, sans-serif; }
      .role-name { fill: #000000; font-size: 30px; font-weight: 700; letter-spacing: -0.4px; }
      .core-title { fill: #000000; font-size: 36px; font-weight: 760; letter-spacing: -0.8px; }
      .core-detail { fill: #000000; font-size: 20px; font-weight: 600; letter-spacing: 0; }
      .core-tag { fill: #fffdf8; stroke: #b6cbc7; stroke-width: 1; }
      .icon { fill: none; stroke: #6d0020; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <circle cx="600" cy="250" r="230" fill="#d9ece8" stroke="#6d0020" stroke-width="4.5" filter="url(#core-shadow)" />
  <circle cx="600" cy="250" r="214" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.62" />

  <g filter="url(#soft-shadow)">
    <circle cx="300" cy="135" r="110" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="900" cy="135" r="110" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="300" cy="365" r="110" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="900" cy="365" r="110" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
  </g>

  <g class="icon" transform="translate(300 108)">
    <circle r="18" />
    <circle r="10" />
    <circle r="3" fill="#6d0020" stroke="none" />
  </g>
  <text class="display role-name" x="300" y="167" text-anchor="middle">Product</text>

  <g class="icon" transform="translate(900 108)">
    <path d="M-15 12l4-13L7-19l12 12L1 11l-13 4z" />
    <path d="M-11-1L1 11" />
    <path d="M7-19l12 12" />
  </g>
  <text class="display role-name" x="900" y="167" text-anchor="middle">Design</text>

  <g class="icon" transform="translate(300 338)">
    <path d="M-9-14l-16 14 16 14" />
    <path d="M9-14L25 0 9 14" />
    <path d="M5-22L-5 22" />
  </g>
  <text class="display role-name" x="300" y="397" text-anchor="middle">Develop</text>

  <g class="icon" transform="translate(900 338)">
    <circle r="19" />
    <path d="M-10 0l7 7 14-16" />
  </g>
  <text class="display role-name" x="900" y="397" text-anchor="middle">Test</text>

  <g class="icon" transform="translate(600 126)">
    <path d="M0-14L14 0 0 14-14 0z" />
    <circle cx="0" cy="-14" r="5" fill="#d9ece8" />
    <circle cx="14" cy="0" r="5" fill="#d9ece8" />
    <circle cx="0" cy="14" r="5" fill="#d9ece8" />
    <circle cx="-14" cy="0" r="5" fill="#d9ece8" />
  </g>
  <text class="display core-title" x="600" y="199" text-anchor="middle">Shared</text>
  <text class="display core-title" x="600" y="238" text-anchor="middle">responsibilities</text>

  <g text-anchor="middle">
    <rect class="core-tag" x="434" y="264" width="190" height="36" rx="18" />
    <text class="display core-detail" x="529" y="288">Product thinking</text>
    <rect class="core-tag" x="634" y="264" width="132" height="36" rx="18" />
    <text class="display core-detail" x="700" y="288">Systems</text>

    <rect class="core-tag" x="439" y="308" width="194" height="36" rx="18" />
    <text class="display core-detail" x="536" y="332">AI development</text>
    <rect class="core-tag" x="643" y="308" width="118" height="36" rx="18" />
    <text class="display core-detail" x="702" y="332">AI agents</text>

    <rect class="core-tag" x="555" y="352" width="90" height="36" rx="18" />
    <text class="display core-detail" x="600" y="376">Ethics</text>
  </g>
</svg>
