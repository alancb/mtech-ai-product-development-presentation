<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 40 700 540" role="img" aria-labelledby="title description">
  <title id="title">Shared responsibilities across an AI-enabled product team</title>
  <desc id="description">A large central circle for shared responsibilities overlaps four separate specialist circles for Product, Design, Develop, and Test.</desc>
  <defs>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.09" />
    </filter>
    <filter id="core-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6d0020" flood-opacity="0.10" />
    </filter>
    <style>
      .display { font-family: Gotham, Montserrat, "Avenir Next", Arial, sans-serif; }
      .role-name { fill: #000000; font-size: 26px; font-weight: 760; letter-spacing: -0.4px; }
      .role-detail { fill: #5f5f5f; font-size: 13px; font-weight: 700; letter-spacing: 0.6px; }
      .core-title { fill: #000000; font-size: 36px; font-weight: 760; letter-spacing: -0.8px; }
      .core-detail { fill: #6d0020; font-size: 14px; font-weight: 720; letter-spacing: 0.2px; }
      .icon { fill: none; stroke: #6d0020; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <circle cx="450" cy="310" r="190" fill="#d9ece8" stroke="#6d0020" stroke-width="4.5" filter="url(#core-shadow)" />
  <circle cx="450" cy="310" r="176" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.62" />

  <g filter="url(#soft-shadow)">
    <circle cx="250" cy="168" r="96" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="650" cy="168" r="96" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="250" cy="452" r="96" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
    <circle cx="650" cy="452" r="96" fill="#fffdf8" fill-opacity="0.97" stroke="#6d0020" stroke-width="3.5" />
  </g>

  <g class="icon" transform="translate(250 124)">
    <circle r="18" />
    <circle r="10" />
    <circle r="3" fill="#6d0020" stroke="none" />
  </g>
  <text class="display role-name" x="250" y="179" text-anchor="middle">Product</text>
  <text class="display role-detail" x="250" y="202" text-anchor="middle">DIRECTION</text>

  <g class="icon" transform="translate(650 124)">
    <path d="M-15 12l4-13L7-19l12 12L1 11l-13 4z" />
    <path d="M-11-1L1 11" />
    <path d="M7-19l12 12" />
  </g>
  <text class="display role-name" x="650" y="179" text-anchor="middle">Design</text>
  <text class="display role-detail" x="650" y="202" text-anchor="middle">EXPERIENCE</text>

  <g class="icon" transform="translate(250 408)">
    <path d="M-9-14l-16 14 16 14" />
    <path d="M9-14L25 0 9 14" />
    <path d="M5-22L-5 22" />
  </g>
  <text class="display role-name" x="250" y="463" text-anchor="middle">Develop</text>
  <text class="display role-detail" x="250" y="486" text-anchor="middle">ENGINEERING</text>

  <g class="icon" transform="translate(650 408)">
    <circle r="19" />
    <path d="M-10 0l7 7 14-16" />
  </g>
  <text class="display role-name" x="650" y="463" text-anchor="middle">Test</text>
  <text class="display role-detail" x="650" y="486" text-anchor="middle">CONFIDENCE</text>

  <g class="icon" transform="translate(450 235)">
    <path d="M0-14L14 0 0 14-14 0z" />
    <circle cx="0" cy="-14" r="5" fill="#d9ece8" />
    <circle cx="14" cy="0" r="5" fill="#d9ece8" />
    <circle cx="0" cy="14" r="5" fill="#d9ece8" />
    <circle cx="-14" cy="0" r="5" fill="#d9ece8" />
  </g>
  <text class="display core-title" x="450" y="305" text-anchor="middle">Shared</text>
  <text class="display core-title" x="450" y="344" text-anchor="middle">responsibilities</text>
  <text class="display core-detail" x="450" y="378" text-anchor="middle">AI · systems · ethics · user needs</text>
</svg>
